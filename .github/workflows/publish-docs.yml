name: Publish docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "_extensions/term/term.lua"
      - "_extensions/term/term.css"
      - "_extensions/term/themes/**"
      - ".github/workflows/publish-docs.yml"
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: dtolnay/rust-toolchain@stable

      - name: Build quarto-term
        run: cargo build --release

      - name: Install dependencies
        run: sudo apt-get install -y zsh fish htop zsh-syntax-highlighting cowsay lolcat python3

      - name: Install Nushell
        run: |
          curl -sL https://github.com/nushell/nushell/releases/download/0.104.0/nu-0.104.0-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv nu-0.104.0-x86_64-unknown-linux-gnu/nu /usr/local/bin/

      - name: Render
        run: quarto render docs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
