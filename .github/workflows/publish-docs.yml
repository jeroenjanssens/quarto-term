name: Publish docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "_extensions/term/term.lua"
      - "_extensions/term/term.css"
      - ".github/workflows/publish-docs.yml"
  workflow_run:
    workflows: ["Build binaries"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install dependencies
        run: sudo apt-get install -y zsh htop zsh-syntax-highlighting

      - name: Render
        run: quarto render docs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
