name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          # Both macOS binaries are built in one job (cross-compiling one of
          # them), so a release needs only one macOS runner
          - name: macos
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            os: macos-latest
          - name: linux-x86_64
            targets: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - name: linux-aarch64
            targets: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - name: windows-x86_64
            targets: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

      - name: Build and rename binaries
        shell: bash
        run: |
          for target in ${TARGETS//,/ }; do
            cargo build --release --target "$target"
            cp "target/$target/release/quarto-term${EXT}" "quarto-term-${target}${EXT}"
          done
        env:
          TARGETS: ${{ matrix.targets }}
          EXT: ${{ matrix.ext }}

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: quarto-term-*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: binary-*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            assets/*
