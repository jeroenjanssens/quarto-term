name: Build binaries

on:
  push:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Copy binary
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release/quarto-term${{ matrix.ext }}"
          dst="_extensions/term/bin/quarto-term-${{ matrix.target }}${{ matrix.ext }}"
          mkdir -p _extensions/term/bin
          cp "$src" "$dst"

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: _extensions/term/bin/quarto-term-${{ matrix.target }}${{ matrix.ext }}

  commit:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: _extensions/term/bin
          pattern: binary-*
          merge-multiple: true

      - name: Make binaries executable
        run: chmod +x _extensions/term/bin/quarto-term-*

      - name: Commit binaries
        run: |
          git config user.name "Jeroen Janssens"
          git config user.email "jeroen@jeroenjanssens.com"
          git add _extensions/term/bin/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update pre-built binaries"
            git push
          fi
