[package]
name = "quarto-term"
version = "0.1.0"
edition = "2021"
description = "A Quarto extension that provides a persistent interactive terminal session across code chunks"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
avt = "0.18"
portable-pty = "0.9"
regex = "1"
