# Configuration for cargo-about, which writes THIRD-PARTY-LICENSES.md: the
# licenses of the Rust crates in the quarto-term binary (`just licenses`)
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "Unlicense",
    "Zlib",
    "Unicode-3.0",
]
# The targets of the release binaries
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false
